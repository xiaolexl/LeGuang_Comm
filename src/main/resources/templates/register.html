<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>注册确认</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #e0e0e0; }
        .header { background-color: #4CAF50; color: white; padding: 10px; text-align: center; }
        .content { padding: 20px; }
        .button { display: inline-block; padding: 10px 20px; background-color: #4CAF50; color: white; text-decoration: none; }
        .footer { margin-top: 20px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>注册确认邮件</h2>
    </div>
    <div class="content">
        <p>亲爱的 ${username}：</p>
        <p>欢迎注册我们的系统！请点击下方按钮完成邮箱验证：</p>
        <p>
            <a href="${verifyUrl}" class="button">点击验证邮箱</a>
        </p>
        <p>如果您没有注册我们的系统，请忽略此邮件。</p>
    </div>
    <div class="footer">
        <p>此邮件由系统自动发送，请勿回复。</p>
    </div>
</div>
</body>
</html>
